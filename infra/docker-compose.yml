services:
  postgres:
    image: postgres:17-alpine
    container_name: webapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: webapp
      POSTGRES_USER: webapp
      POSTGRES_PASSWORD: webapp
    ports:
      - "5432:5432"
    volumes:
      - webapp-postgres-data:/var/lib/postgresql/data

volumes:
  webapp-postgres-data:
